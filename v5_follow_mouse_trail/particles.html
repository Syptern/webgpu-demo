<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>WebGPU Particles</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                background: #04040e;
                overflow: hidden;
                font-family: "Inter", system-ui, sans-serif;
            }
            canvas {
                display: block;
            }

            #title {
                position: fixed;
                top: 32px;
                left: 40px;
                font-size: 11px;
                font-weight: 500;
                letter-spacing: 0.15em;
                text-transform: uppercase;
                color: rgba(255, 255, 255, 0.2);
                pointer-events: none;
            }

            #perf {
                position: fixed;
                top: 32px;
                right: 40px;
                font-size: 11px;
                font-weight: 500;
                letter-spacing: 0.1em;
                color: rgba(255, 255, 255, 0.25);
                pointer-events: none;
                font-variant-numeric: tabular-nums;
            }

            #hint {
                position: fixed;
                bottom: 32px;
                left: 50%;
                transform: translateX(-50%);
                font-size: 12px;
                letter-spacing: 0.1em;
                color: rgba(255, 255, 255, 0.2);
                pointer-events: none;
                white-space: nowrap;
            }

            #error {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                color: #ff5555;
                font-family: monospace;
                font-size: 16px;
                text-align: center;
                line-height: 1.8;
                display: none;
            }

            .vignette {
                position: fixed;
                inset: 0;
                background: radial-gradient(
                    ellipse at center,
                    transparent 40%,
                    rgba(4, 4, 14, 0.65) 100%
                );
                pointer-events: none;
            }

            #gui {
                position: fixed;
                top: 64px;
                left: 40px;
                width: 230px;
                padding: 16px 18px 18px;
                background: rgba(10, 10, 22, 0.72);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 10px;
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                font-size: 11px;
                color: rgba(255, 255, 255, 0.85);
                user-select: none;
                z-index: 10;
            }
            #gui h2 {
                font-size: 10px;
                font-weight: 600;
                letter-spacing: 0.15em;
                text-transform: uppercase;
                color: rgba(255, 255, 255, 0.4);
                margin-bottom: 14px;
            }
            #gui .row {
                margin-bottom: 12px;
            }
            #gui .row label {
                display: flex;
                justify-content: space-between;
                margin-bottom: 5px;
                letter-spacing: 0.04em;
            }
            #gui .row label .val {
                color: rgba(120, 180, 255, 0.95);
                font-variant-numeric: tabular-nums;
            }
            #gui input[type="range"] {
                width: 100%;
                height: 3px;
                appearance: none;
                -webkit-appearance: none;
                background: rgba(255, 255, 255, 0.15);
                border-radius: 2px;
                outline: none;
                cursor: pointer;
            }
            #gui input[type="range"]::-webkit-slider-thumb {
                appearance: none;
                -webkit-appearance: none;
                width: 13px;
                height: 13px;
                border-radius: 50%;
                background: rgba(120, 180, 255, 1);
                box-shadow: 0 0 8px rgba(120, 180, 255, 0.6);
            }
            #gui input[type="range"]::-moz-range-thumb {
                width: 13px;
                height: 13px;
                border: none;
                border-radius: 50%;
                background: rgba(120, 180, 255, 1);
            }
            #gui .reset {
                margin-top: 4px;
                width: 100%;
                padding: 7px;
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 6px;
                color: rgba(255, 255, 255, 0.7);
                font-size: 10px;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                cursor: pointer;
            }
            #gui .reset:hover {
                background: rgba(255, 255, 255, 0.12);
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div class="vignette"></div>
        <div id="title">WebGPU Particles</div>
        <div id="perf">-- fps</div>
        <div id="error"></div>
        <div id="gui"></div>

        <script>
            const MAX_PARTICLES = 1_000_000;

            async function main() {
                if (!navigator.gpu) {
                    showError(
                        "WebGPU not supported.\nTry Chrome 113+ or Edge 113+.",
                    );
                    return;
                }

                const adapter = await navigator.gpu.requestAdapter({
                    powerPreference: "high-performance",
                });
                if (!adapter) {
                    showError("No WebGPU adapter available.");
                    return;
                }

                const device = await adapter.requestDevice();
                const canvas = document.getElementById("canvas");
                const gpuCtx = canvas.getContext("webgpu");
                const format = navigator.gpu.getPreferredCanvasFormat();

                let W = 0,
                    H = 0;

                function resize() {
                    const dpr = devicePixelRatio;
                    W = Math.floor(window.innerWidth * dpr);
                    H = Math.floor(window.innerHeight * dpr);
                    canvas.width = W;
                    canvas.height = H;
                    canvas.style.width = window.innerWidth + "px";
                    canvas.style.height = window.innerHeight + "px";
                    gpuCtx.configure({ device, format, alphaMode: "opaque" });
                }
                resize();
                window.addEventListener("resize", resize);

                // ── Particle buffer ──────────────────────────────────────────────────────
                // Per particle: pos(2) vel(2) home(2) seed(2). Only pos/vel used.
                const STRIDE = 8;
                const pData = new Float32Array(MAX_PARTICLES * STRIDE);

                for (let i = 0; i < MAX_PARTICLES; i++) {
                    const b = i * STRIDE;
                    // Scatter in a small disk around screen center
                    const a = Math.random() * Math.PI * 2;
                    const rad = Math.sqrt(Math.random()) * Math.min(W, H) * 0.2;
                    pData[b + 0] = W * 0.5 + Math.cos(a) * rad; // pos.x
                    pData[b + 1] = H * 0.5 + Math.sin(a) * rad; // pos.y
                    pData[b + 2] = 0; // vel.x
                    pData[b + 3] = 0; // vel.y
                    pData[b + 6] = Math.random() * 1000; // seed.x (jitter phase)
                    pData[b + 7] = Math.random() * 1000; // seed.y
                }

                const particleBuf = device.createBuffer({
                    size: pData.byteLength,
                    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
                });
                device.queue.writeBuffer(particleBuf, 0, pData);

                // ── Uniform buffers ──────────────────────────────────────────────────────
                // Compute: canvasSize(2) dt time scale flowSpeed damping _ speedCap
                //          morphSpeed
                const cuData = new Float32Array(16); // padded to 64b
                const cuBuf = device.createBuffer({
                    size: 64,
                    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
                });

                // Render: canvasSize(2) particleSize brightness
                const ruData = new Float32Array(4); // 16b
                const ruBuf = device.createBuffer({
                    size: 16,
                    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
                });

                // ── Live-tunable parameters (driven by the GUI) ──────────────────────────
                const params = {
                    count: 20000,
                    scale: 0.004, // noise frequency (per pixel)
                    flowSpeed: 400, // swirl speed (px/s)
                    pull: 250, // attraction accel near cursor (px/s^2)
                    clusterRadius: 200, // cloud size (px)
                    jitter: 400, // brownian kick (px/s)
                    damping: 1.2,
                    speedCap: 900,
                    morphSpeed: 0.15,
                    particleSize: 1.4,
                    brightness: 0.45,
                };
                const defaults = { ...params };

                // ── Build the control panel ──────────────────────────────────────────────
                const SLIDERS = [
                    { key: "count", label: "Particles", min: 1000, max: MAX_PARTICLES, step: 1000, fmt: (v) => (v / 1000).toFixed(0) + "k" },
                    { key: "scale", label: "Noise scale", min: 0.001, max: 0.012, step: 0.0005, fmt: (v) => v.toFixed(4) },
                    { key: "flowSpeed", label: "Flow speed", min: 0, max: 1200, step: 10, fmt: (v) => v.toFixed(0) },
                    { key: "clusterRadius", label: "Cloud size", min: 30, max: 600, step: 10, fmt: (v) => v.toFixed(0) },
                    { key: "pull", label: "Attraction", min: 0, max: 800, step: 10, fmt: (v) => v.toFixed(0) },
                    { key: "jitter", label: "Jitter", min: 0, max: 800, step: 10, fmt: (v) => v.toFixed(0) },
                    { key: "damping", label: "Damping", min: 0, max: 6, step: 0.1, fmt: (v) => v.toFixed(1) },
                    { key: "speedCap", label: "Speed cap", min: 50, max: 2000, step: 10, fmt: (v) => v.toFixed(0) },
                    { key: "morphSpeed", label: "Morph speed", min: 0, max: 1, step: 0.01, fmt: (v) => v.toFixed(2) },
                ];

                const gui = document.getElementById("gui");
                gui.innerHTML = "<h2>Flow Controls</h2>";
                const valEls = {};
                for (const s of SLIDERS) {
                    const row = document.createElement("div");
                    row.className = "row";
                    row.innerHTML =
                        `<label>${s.label}<span class="val">${s.fmt(params[s.key])}</span></label>` +
                        `<input type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${params[s.key]}">`;
                    const input = row.querySelector("input");
                    const val = row.querySelector(".val");
                    valEls[s.key] = { input, val, fmt: s.fmt };
                    input.addEventListener("input", () => {
                        params[s.key] = parseFloat(input.value);
                        val.textContent = s.fmt(params[s.key]);
                    });
                    gui.appendChild(row);
                }
                const resetBtn = document.createElement("button");
                resetBtn.className = "reset";
                resetBtn.textContent = "Reset";
                resetBtn.addEventListener("click", () => {
                    Object.assign(params, defaults);
                    for (const s of SLIDERS) {
                        valEls[s.key].input.value = params[s.key];
                        valEls[s.key].val.textContent = s.fmt(params[s.key]);
                    }
                });
                gui.appendChild(resetBtn);

                // ── Shaders (loaded from external .wgsl files) ───────────────────────────
                const [computeCode, renderCode] = await Promise.all([
                    fetch("compute.wgsl").then((r) => r.text()),
                    fetch("render.wgsl").then((r) => r.text()),
                ]);

                // ── Pipelines ────────────────────────────────────────────────────────────
                const computePipeline = device.createComputePipeline({
                    layout: "auto",
                    compute: {
                        module: device.createShaderModule({
                            code: computeCode,
                        }),
                        entryPoint: "cs",
                    },
                });

                const renderPipeline = device.createRenderPipeline({
                    layout: "auto",
                    vertex: {
                        module: device.createShaderModule({ code: renderCode }),
                        entryPoint: "vs",
                    },
                    fragment: {
                        module: device.createShaderModule({ code: renderCode }),
                        entryPoint: "fs",
                        targets: [
                            {
                                format,
                                blend: {
                                    color: {
                                        srcFactor: "src-alpha",
                                        dstFactor: "one",
                                        operation: "add",
                                    },
                                    alpha: {
                                        srcFactor: "zero",
                                        dstFactor: "one",
                                        operation: "add",
                                    },
                                },
                            },
                        ],
                    },
                    primitive: { topology: "triangle-list" },
                });

                // ── Bind groups ──────────────────────────────────────────────────────────
                const computeBG = device.createBindGroup({
                    layout: computePipeline.getBindGroupLayout(0),
                    entries: [
                        { binding: 0, resource: { buffer: particleBuf } },
                        { binding: 1, resource: { buffer: cuBuf } },
                    ],
                });

                const renderBG = device.createBindGroup({
                    layout: renderPipeline.getBindGroupLayout(0),
                    entries: [
                        { binding: 0, resource: { buffer: particleBuf } },
                        { binding: 1, resource: { buffer: ruBuf } },
                    ],
                });

                // ── Input: cursor position (the cluster follows it) ──────────────────────
                let mouseX = W * 0.5;
                let mouseY = H * 0.5;

                function onMove(cx, cy) {
                    mouseX = cx * devicePixelRatio;
                    mouseY = cy * devicePixelRatio;
                }

                window.addEventListener("mousemove", (e) => onMove(e.clientX, e.clientY));
                canvas.addEventListener(
                    "touchmove",
                    (e) => { e.preventDefault(); onMove(e.touches[0].clientX, e.touches[0].clientY); },
                    { passive: false },
                );

                // ── Loop ─────────────────────────────────────────────────────────────────
                let last = performance.now();

                // FPS tracking
                const perfEl = document.getElementById("perf");
                let frameTimes = [];
                let perfTick = 0;

                function frame() {
                    const now = performance.now();
                    const dt = Math.min((now - last) * 0.001, 1 / 30);
                    frameTimes.push(now - last);
                    if (frameTimes.length > 60) frameTimes.shift();
                    if (++perfTick % 20 === 0) {
                        const avg =
                            frameTimes.reduce((a, b) => a + b, 0) /
                            frameTimes.length;
                        const fps = (1000 / avg).toFixed(0);
                        const ms = avg.toFixed(1);
                        perfEl.textContent = `${fps} fps · ${ms} ms`;
                    }
                    last = now;

                    const dpr = devicePixelRatio;
                    const n = params.count | 0;

                    cuData[0] = W;
                    cuData[1] = H;
                    cuData[2] = dt;
                    cuData[3] = now * 0.001;
                    cuData[4] = params.scale;
                    cuData[5] = params.flowSpeed;
                    cuData[6] = params.damping;
                    cuData[7] = params.pull;
                    cuData[8] = params.speedCap;
                    cuData[9] = params.morphSpeed;
                    cuData[10] = mouseX;
                    cuData[11] = mouseY;
                    cuData[12] = params.clusterRadius * dpr;
                    cuData[13] = params.jitter * dpr;
                    device.queue.writeBuffer(cuBuf, 0, cuData);

                    ruData[0] = W;
                    ruData[1] = H;
                    ruData[2] = params.particleSize * dpr;
                    ruData[3] = params.brightness;
                    device.queue.writeBuffer(ruBuf, 0, ruData);

                    const enc = device.createCommandEncoder();

                    const cp = enc.beginComputePass();
                    cp.setPipeline(computePipeline);
                    cp.setBindGroup(0, computeBG);
                    cp.dispatchWorkgroups(Math.ceil(n / 64));
                    cp.end();

                    const rp = enc.beginRenderPass({
                        colorAttachments: [
                            {
                                view: gpuCtx.getCurrentTexture().createView(),
                                clearValue: {
                                    r: 0.016,
                                    g: 0.016,
                                    b: 0.055,
                                    a: 1.0,
                                },
                                loadOp: "clear",
                                storeOp: "store",
                            },
                        ],
                    });
                    rp.setPipeline(renderPipeline);
                    rp.setBindGroup(0, renderBG);
                    rp.draw(6, n);
                    rp.end();

                    device.queue.submit([enc.finish()]);
                    requestAnimationFrame(frame);
                }

                requestAnimationFrame(frame);
            }

            function showError(msg) {
                const el = document.getElementById("error");
                el.innerHTML = msg.replace(/\n/g, "<br>");
                el.style.display = "block";
            }

            main().catch((e) => showError(e.message || String(e)));
        </script>
    </body>
</html>
